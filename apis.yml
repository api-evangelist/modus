name: Modus
description: >-
  Modus (Modus Technologies, formerly Modus Closing) was a real estate closing,
  title, and escrow technology startup backed by 500 Global and Lightspeed
  Venture Partners. It built software to modernize the home-closing experience
  for buyers, sellers, and real estate agents. Modus was acquired by Compass in
  2021; its standalone product was wound down and folded into Compass. As of this
  enrichment pass, modusclosing.com serves only a Compass-branded placeholder
  page (titled "Modus Technologies") that loads Compass CDN assets, and the
  company publishes no developer portal, documentation, OpenAPI/AsyncAPI specs,
  SDKs, or any other public API surface. This profile is retained as an honest
  historical company record with no API artifacts to enrich.
